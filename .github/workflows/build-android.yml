# Build Android APK for testing (runs on every push)

name: Build Android Debug

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.7'
          cache: true

      - run: flutter pub get

      - name: Generate and verify all supported languages
        run: |
          flutter gen-l10n
          python3 scripts/check_localizations.py --escape-dart-isolates
          python3 -m unittest discover -s scripts -p test_check_localizations.py

      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --dart-define=REVENUECAT_ANDROID_API_KEY=${{ secrets.REVENUECAT_ANDROID_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: CleanupApp API Key

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cleanupapp.cleaner
      vars:
        APP_STORE_CONNECT_ISSUER_ID: 5325aa4e-8a81-4662-94d3-83961c7e1151
        APP_STORE_CONNECT_KEY_IDENTIFIER: 5WHQMRJ2GT
        BUNDLE_ID: com.cleanupapp.cleaner
        APP_STORE_APP_ID: 6764532900
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Install dependencies
        script: |
          flutter pub get

      - name: Set bundle version
        script: |
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" || echo 0)
          agvtool new-version -all $((LATEST_BUILD + 1))
        working_directory: ios

      - name: Build iOS
        script: |
          flutter build ipa \
            --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
        cancel_previous_submissions: true
        beta_groups:
          - Internal Testing

  android-release:
    name: Android Release
    max_build_duration: 30
    instance_type: linux_x2

    environment:
      flutter: stable
      java: 17

    scripts:
      - name: Install dependencies
        script: flutter pub get

      - name: Build Android APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
